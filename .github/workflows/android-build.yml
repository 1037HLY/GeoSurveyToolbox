name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle Wrapper
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleRelease
    
    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
    
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-Signed-APK
        path: app/build/outputs/apk/release/*-signed.apk
        retention-days: 30
    
    - name: Upload Unsigned APK (Debug)
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-Unsigned-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Upload Mapping File
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ProGuard-Mapping
        path: app/build/outputs/mapping/release/mapping.txt
        retention-days: 30
    
    - name: Build Success
      if: success()
      run: |
        echo "✅ APK构建成功！"
        echo "📱 下载地址: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    
    - name: Build Failure
      if: failure()
      run: |
        echo "❌ APK构建失败！"
        echo "🔍 查看日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
