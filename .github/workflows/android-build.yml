name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # 先下载并初始化Gradle Wrapper
    - name: Setup Gradle Wrapper
      run: |
        # 删除空的占位文件
        rm -f gradle/wrapper/gradle-wrapper.jar
        # 下载官方gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        # 设置权限
        chmod +x gradlew
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleRelease
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Upload Mapping File
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ProGuard-Mapping
        path: app/build/outputs/mapping/release/mapping.txt
        retention-days: 30
