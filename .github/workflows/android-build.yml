name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build APK
      run: ./gradlew assembleRelease
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Upload Mapping File
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ProGuard-Mapping
        path: app/build/outputs/mapping/release/mapping.txt
        retention-days: 30
    
    - name: Build Success
      if: success()
      run: |
        echo "✅ APK构建成功！"
        echo "📱 下载地址: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    
    - name: Build Failure
      if: failure()
      run: |
        echo "❌ APK构建失败！"
        echo "🔍 查看日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
