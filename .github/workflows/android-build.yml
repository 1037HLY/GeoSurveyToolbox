name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle Wrapper
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Clean build (fix kapt cache)
      run: |
        ./gradlew clean
        rm -rf app/build
        rm -rf .gradle
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: GeoSurveyToolbox-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Upload Mapping File
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ProGuard-Mapping
        path: app/build/outputs/mapping/debug/mapping.txt
        retention-days: 30
    
    - name: Build Success
      if: success()
      run: |
        echo "✅ Debug APK构建成功！"
        echo "📱 下载地址: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    
    - name: Build Failure
      if: failure()
      run: |
        echo "❌ APK构建失败！"
        echo "🔍 查看日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
